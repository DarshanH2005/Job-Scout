name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock pytest

      - name: Check no local data is tracked
        shell: pwsh
        run: |
          $pattern = '(^|/)(\.env$|.*\.sqlite3.*|__pycache__/|\.pytest_cache/|backups/)'
          $bad = git ls-files | Select-String -Pattern $pattern
          if ($bad) {
            Write-Error "Local data or credentials must not be committed: $bad"
            exit 1
          }
          Write-Host "No local data tracked."

      - name: Run the test suite
        run: python -m pytest -q
